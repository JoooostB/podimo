name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/joooostb/podimo

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build & push multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For keyless (OIDC) cosign signing
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: sigstore/cosign-installer@v4.1.2

      # QEMU enables building linux/arm64 on the amd64 runner
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag v1.2.3 -> :1.2.3, :1.2 and :1; every push to main moves :latest
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keep the manifest list to just the two real arches
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keyless signing against the public Sigstore instance; verifiable with
      # cosign verify --certificate-identity-regexp 'github.com/JoooostB/podimo'
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com <image>
      - name: Sign the published image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
