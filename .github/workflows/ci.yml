name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      # Fails on dependencies with known CVEs, which also blocks Renovate automerge.
      # PYSEC-2026-2447 (diskcache pickle deserialization) has no fixed release
      # and needs write access to the local cache dir, which already implies
      # code execution as the service user. Drop the ignore once a fix ships.
      - name: Audit dependencies
        run: uv run pip-audit --ignore-vuln PYSEC-2026-2447

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Smoke build only; publishing happens in release.yml
      - name: Build image
        run: docker build -t podimo .
