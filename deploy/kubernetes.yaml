# Example Kubernetes deployment for Podimo to RSS.
#
# Adjust before applying:
#   - the hostname (podimo.example.com) in the env vars and the route
#   - the parentRefs in the HTTPRoute (or use the Ingress variant at the bottom)
#   - the storageClassName / size of the cache volume if the defaults don't fit
#
# The feed-credential encryption key is read from a Secret so it never sits on
# the cache volume next to the data it protects. Create it once:
#
#   kubectl create secret generic podimo \
#     --from-literal=encryption-key="$(python3 -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
#
# Apply with: kubectl apply -f deploy/kubernetes.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: podimo
  labels:
    app.kubernetes.io/name: podimo
spec:
  selector:
    app.kubernetes.io/name: podimo
  ports:
    - name: http
      port: 12104
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: podimo
  labels:
    app.kubernetes.io/name: podimo
spec:
  # The cache is a local SQLite-backed store; running more than one replica
  # would give each pod its own tokens and caches
  replicas: 1
  serviceName: podimo
  selector:
    matchLabels:
      app.kubernetes.io/name: podimo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podimo
    spec:
      # The app never talks to the Kubernetes API
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Matches the user baked into the image
        runAsUser: 1000
        runAsGroup: 1000
        # Makes the cache volume writable for the non-root user
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: podimo
          # Pin to a major version; Renovate or your own process bumps it
          image: ghcr.io/joooostb/podimo:2
          ports:
            - name: http
              containerPort: 12104
          env:
            # The public hostname and protocol, used in the URLs shown to users
            - name: PODIMO_HOSTNAME
              value: "podimo.example.com"
            - name: PODIMO_PROTOCOL
              value: "https"
            - name: PODIMO_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: podimo
                  key: encryption-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cache
              mountPath: /src/cache
            # Scratch space, since the root filesystem is read-only
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            # No CPU limit: throttling a small async server hurts more than
            # letting it burst. The memory limit guards the node.
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: cache
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: your-storage-class
        resources:
          requests:
            storage: 1Gi
---
# Gateway API route. Requires a Gateway in the cluster; point parentRefs at it.
# TLS termination is the Gateway's job, configured on its listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podimo
  labels:
    app.kubernetes.io/name: podimo
spec:
  parentRefs:
    - name: your-gateway
      namespace: your-gateway-namespace
  hostnames:
    - "podimo.example.com"
  rules:
    - backendRefs:
        - name: podimo
          port: 12104
---
# Ingress alternative, if you don't run the Gateway API. Delete the HTTPRoute
# above and uncomment this instead. Feed URLs carry access to Podimo accounts,
# so terminate TLS here and don't serve plain HTTP externally.
#
# apiVersion: networking.k8s.io/v1
# kind: Ingress
# metadata:
#   name: podimo
#   labels:
#     app.kubernetes.io/name: podimo
#   annotations:
#     cert-manager.io/cluster-issuer: letsencrypt
# spec:
#   ingressClassName: nginx
#   tls:
#     - hosts: ["podimo.example.com"]
#       secretName: podimo-tls
#   rules:
#     - host: podimo.example.com
#       http:
#         paths:
#           - path: /
#             pathType: Prefix
#             backend:
#               service:
#                 name: podimo
#                 port:
#                   number: 12104
