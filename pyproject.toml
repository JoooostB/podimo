[project]
name = "podimo"
version = "2.0.0"
description = "Serve Podimo podcasts as RSS feeds for use in any podcast player"
readme = "README.md"
license = "EUPL-1.2"
requires-python = ">=3.11"
authors = [
    { name = "Thijs Raymakers" },
    { name = "Joost Buskermolen" },
]
dependencies = [
    "aiohttp>=3.14",
    "cloudscraper>=1.2.71",
    "cryptography>=45",
    "diskcache>=5.6",
    "feedgen>=1.0",
    "hypercorn>=0.18",
    "python-dotenv>=1.2",
    "quart>=0.21",
    "werkzeug>=3.1",
    "zenrows>=1.4",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9",
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["podimo"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
